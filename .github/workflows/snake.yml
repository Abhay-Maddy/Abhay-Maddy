name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Abhay-Maddy
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7dd3fc&color_dots=#e8f9ee,#7bdb9e,#3fc478,#1f9e57,#0a6b38
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7dd3fc&color_dots=#0a3d24,#1f9e57,#3fc478,#7bdb9e,#c8f7dc

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
